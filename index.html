    return;
  }
  studentName = nameInput;
  Storage.set('lastStudentName', studentName);
  studentAttempts = parseInt(Storage.get('attempts_' + studentName) || '0');
  document.getElementById('nameView').classList.add('hidden');
  document.getElementById('menuView').classList.remove('hidden');
  document.getElementById('welcomeName').innerHTML = studentName;
  displayHighScores();
}

function startQuiz() {
  studentAttempts = parseInt(Storage.get('attempts_' + studentName) || '0');
  var pool = [];
  EXAM_GROUPS.forEach(function (g) {
    var group = g.key;
    DB[group].forEach(function (q) { pool.push({text: q.text, options: q.options, c: q.c, e: q.e, group: group}); });
  });
  currentKey = 'FULL';
  correctPerGroup = {};
  EXAM_GROUPS.forEach(function (g) { correctPerGroup[g.key] = 0; });
  questions = pool;
  qIndex = 0;
  correct = 0;
  timeLeft = questions.length * 90;
  document.getElementById('menuView').classList.add('hidden');
  document.getElementById('questionView').classList.remove('hidden');
  document.getElementById('highScoreDisplay').innerHTML = '';
  // کارنامه و پیام آزمون پیشین پاک می‌شود تا آزمون تازه با صفحهٔ تمیز آغاز شود
  setScoreSummary(null);
  setStatus('');
  startTimer();
  loadQuestion();
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  updateTimer();
  timerId = setInterval(function() {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      alert('⏰ زمان آزمون به پایان رسید!');
      goToMenu();
    }
  }, 1000);
}

function updateTimer() {
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  document.getElementById('timerDisplay').innerHTML = '⏱ ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function loadQuestion() {
  isAnswered = false;
  var q = questions[qIndex];
  var btn = document.getElementById('actionBtn');
  btn.innerHTML = 'ثبت پاسخ';
  btn.className = 'btn-submit';
  btn.style.backgroundColor = '';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('feedbackBox').innerHTML = '';
  document.getElementById('progressText').innerHTML = 'سوال ' + (qIndex+1) + ' از ' + questions.length;
  document.getElementById('groupLabel').innerHTML = LABELS[q.group] || '';
  document.getElementById('questionText').innerHTML = q.text;
  var oc = document.getElementById('optionsContainer');
  oc.innerHTML = '';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    var label = document.createElement('label');
    label.className = 'option';
    var radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'currentQ';
    radio.value = opt.v;
    label.appendChild(radio);
    label.innerHTML += opt.l;
    oc.appendChild(label);
  }
}

function handleAction() {
  if (!isAnswered) { submitAnswer(); } else { goNext(); }
}

function submitAnswer() {
  var selected = document.querySelector('input[name="currentQ"]:checked');
  if (!selected) { alert('لطفاً یک گزینه را انتخاب کنید!'); return; }
  isAnswered = true;
  var q = questions[qIndex];
  if (selected.value === q.c) correctPerGroup[q.group] = (correctPerGroup[q.group] || 0) + 1;
  var rb = document.getElementById('resultBox');
  var fb = document.getElementById('feedbackBox');
  var opts = document.querySelectorAll('.option');
  var btn = document.getElementById('actionBtn');
  for (var i = 0; i < opts.length; i++) opts[i].classList.add('disabled');
  rb.style.display = 'block';
  fb.style.display = 'block';
  if (selected.value === q.c) {
    correct++;
    rb.style.backgroundColor = '#d4edda';
    rb.style.color = '#155724';
    rb.innerHTML = '✔ پاسخ شما صحیح است!';
    fb.style.borderRightColor = '#27ae60';
    fb.innerHTML = q.e;
    for (var i = 0; i < opts.length; i++) {
      if (opts[i].querySelector('input').value === q.c) opts[i].classList.add('correct-highlight');
    }
  } else {
    rb.style.backgroundColor = '#f8d7da';
    rb.style.color = '#721c24';
    rb.innerHTML = '✘ پاسخ شما نادرست است.';
    fb.style.borderRightColor = '#e74c3c';
    var correctLabel = '';
    for (var i = 0; i < q.options.length; i++) { if (q.options[i].v === q.c) correctLabel = q.options[i].l; }
    fb.innerHTML = '<b>پاسخ صحیح: </b>' + correctLabel + '<br><br>' + q.e;
    for (var i = 0; i < opts.length; i++) {
      var val = opts[i].querySelector('input').value;
      if (val === q.c) opts[i].classList.add('correct-highlight');
      if (val === selected.value) opts[i].classList.add('wrong-highlight');
    }
  }
  if (qIndex < questions.length - 1) {
    btn.innerHTML = 'سوال بعدی';
    btn.className = 'btn-next';
  } else {
    btn.innerHTML = 'پایان و ثبت نمره';
    btn.className = 'btn-next';
    btn.style.backgroundColor = '#e67e22';
  }
}

function goNext() {
  qIndex++;
  if (qIndex < questions.length) { loadQuestion(); } else { finishQuiz(); }
}

function finishQuiz() {
  clearInterval(timerId);
  var pct = Math.round((correct / questions.length) * 100);
  var lines = [];
  EXAM_GROUPS.forEach(function (g) {
    var got = correctPerGroup[g.key] || 0;
    var all = DB[g.key].length;
    lines.push(g.label + ': ' + got + ' از ' + all);
  });
  var breakdown = lines.join('   |   ');
  var key = 'bestScore_' + currentKey;
  var prev = parseInt(Storage.get(key) || '0');
  if (pct > prev) Storage.set(key, pct);   // currentKey در این نسخه همیشه FULL است
  // شمارش پیش از ارسال انجام می‌شود تا ایمیل دبیر شمارهٔ درست را نشان دهد
  studentAttempts = parseInt(Storage.get('attempts_' + studentName) || '0') + 1;
  Storage.set('attempts_' + studentName, studentAttempts);
  // نمره پیش از ارسال به دانش‌آموز نشان داده می‌شود تا خودش هم آن را بداند
  setScoreSummary(studentName, correct, questions.length, pct, studentAttempts, breakdown);
  setStatus('⏳ در حال ارسال نتیجه به دبیر...', 'info');
  sendResultToTeacher(correct, questions.length, pct, breakdown, function (sent) {
    if (sent) {
      setStatus('✅ نتیجهٔ آزمون برای دبیر ارسال شد.', 'ok');
    } else {
      setStatus('⚠️ ارسال نتیجه به دبیر انجام نشد. لطفاً اینترنت گوشی را بررسی کنید و از طریق دکمهٔ زیر دوباره بفرستید.', 'warn', true);
    }
  });
  alert('🎉 آزمون به پایان رسید!\n\n' + studentName + ' عزیز\nنمره شما: ' + correct + ' از ' + questions.length + ' (' + pct + '%)\n\nشما تا کنون ' + studentAttempts + ' بار در آزمون شرکت کرده‌اید.');
  goToMenu();
}

// ===== کارنامهٔ کوتاه برای دانش‌آموز =====
function setScoreSummary(name, score, total, pct, attempts, breakdown) {
  var box = document.getElementById('scoreBox');
  if (name === null) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = 'block';
  box.className = 'score-box';
  box.innerHTML = '<span class="score-main">' + name + ' عزیز، نمرهٔ بخش: ' + score + ' / ' + total + '  (' + pct + '%)</span>' +
                  '<span class="score-sub">' + (breakdown || '') + '</span>' +
                  '<span class="score-sub">این ' + attempts + ' اُمین بار شرکت شما در آزمون بود.</span>';
}

// ===== پیام وضعیت ارسال، برای دانش‌آموز =====
function setStatus(message, kind, withRetry) {
  var box = document.getElementById('statusBox');
  if (!message) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = 'block';
  box.className = 'status-box ' + kind;
  box.innerHTML = message;
  if (withRetry) {
    var btn = document.createElement('button');
    btn.className = 'btn-retry';
    btn.innerHTML = '🔄 ارسال دوبارهٔ نتیجه';
    btn.addEventListener('click', function () {
      setStatus('⏳ در حال ارسال مجدد...', 'info');
      sendResultToTeacher(correct, questions.length, Math.round((correct / questions.length) * 100), breakdown, function (sent) {
        if (sent) {
          setStatus('✅ نتیجهٔ آزمون برای دبیر ارسال شد.', 'ok');
        } else {
          setStatus('⚠️ باز هم ارسال نشد. لطفاً به دبیر اطلاع دهید.', 'warn', false);
        }
      });
    });
    box.appendChild(btn);
  }
}

// ===== ارسال نتیجه به ایمیل دبیر با Web3Forms =====
function sendResultToTeacher(score, total, pct, breakdown, onDone) {
  var groupNames = {A: 'صحیح/غلط', B: 'جای خالی', C: 'چهارگزینه‌ای', D: 'متمم و اجتماع', E: 'تست‌های ترکیبی'};
  var done = (typeof onDone === 'function') ? onDone : function () {};
  var data = {
    access_key: WEB3FORMS_KEY,
    // فیلد ضدربات: همیشه خالی می‌ماند. اگر رباتی آن را پر کند، Web3Forms ارسال را رد می‌کند
    botcheck: false,
    // نمره در عنوان ایمیل هم می‌آید تا در فهرست صندوق هم دیده شود
    subject: 'Azmoon | ' + score + '/' + total + ' (' + pct + '%) | آزمون کامل | ' + studentName,
    from_name: 'سامانه آزمون ریاضی',
    'کارنامه': 'نمره ' + score + '/' + total + '   |   درصد ' + pct + '%   |   تعداد شرکت ' + studentAttempts + '   |   ' + new Date().toLocaleString('fa-IR'),
    'نمره': score + ' / ' + total,
    'درصد': pct + '%',
    'نام دانش‌آموز': studentName,
    'آزمون': groupNames[currentKey] || currentKey,
    'کارنامهٔ بخش‌ها': breakdown || '',
    'تعداد سوالات': total,
    'تعداد پاسخ صحیح': score,
    'تعداد شرکت': studentAttempts,
    'تاریخ و زمان': new Date().toLocaleString('fa-IR')
  };
  var finished = false;
  function finish(sent) {
    if (finished) return;
    finished = true;
    if (sent) console.log('✅ نتیجه با موفقیت ارسال شد.');
    done(sent);
  }
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(data),
    signal: ctrl ? ctrl.signal : undefined
  })
  .then(function (response) {
    return response.json().catch(function () { return { success: false }; })
      .then(function (result) {
        clearTimeout(guard);
        if (result && result.success) {
          finish(true);
        } else {
          console.error('❌ ارسال ناموفق بود:', result);
          finish(false);
        }
      });
  })
  .catch(function (error) {
    clearTimeout(guard);
    console.error('خطا در ارسال:', error);
    finish(false);
  });
}

function goToMenu() {
  if (timerId) clearInterval(timerId);
  document.getElementById('questionView').classList.add('hidden');
  document.getElementById('menuView').classList.remove('hidden');
  displayHighScores();
  questions = [];
  qIndex = 0;
  isAnswered = false;
  correct = 0;
}

function displayHighScores() {
  var groups = ['A','B','C','D','E'];
  var html = '';
  for (var i = 0; i < groups.length; i++) {
    var s = Storage.get('bestScore_' + groups[i]);
    if (s) html += 'آزمون کامل: ' + s + '% | ';
  }
  document.getElementById('highScoreDisplay').innerHTML = html ? '🏆 رکوردها: ' + html : '';
}

function init() {
  document.getElementById('btnEnter').addEventListener('click', saveName);
  document.getElementById('actionBtn').addEventListener('click', handleAction);
  document.getElementById('backBtn').addEventListener('click', goToMenu);
  var btns = document.querySelectorAll('.menu-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      startQuiz(this.getAttribute('data-group'));
    });
  }
  document.getElementById('studentName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { saveName(); }
  });
  displayHighScores();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
